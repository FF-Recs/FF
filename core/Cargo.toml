[package]
name = "ff-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
sha2 = "0.10"
hex = "0.4"
fastrand = "2.5"
memmap2 = "0.9"
bytemuck = "1"
safetensors = "=0.8.0"
parquet = { version = "56", default-features = false, features = ["snap", "zstd", "flate2-zlib-rs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
parking_lot = "0.12"

[dev-dependencies]
ff-test-support = { path = "../test-support" }
tokio = { version = "1", features = ["test-util"] }
